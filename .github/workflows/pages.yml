name: iPad console

# Publishes the console to GitHub Pages so an iPad can Add to Home Screen
# over HTTPS. The log still lives on the device; this origin only delivers
# the app shell.

on:
  push:
    branches:
      - cursor/ipad-operator-console-fc0c
      - claude/system-architecture-foundation-pjk5s2
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ipad-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish M4D
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/m4d/ipad/static

      - id: deployment
        uses: actions/deploy-pages@v4
