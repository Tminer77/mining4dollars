<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkChat</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa; --panel: #ffffff; --ink: #17170f; --muted: #6b6b60;
    --line: #e3e3dc; --accent: #2f6f4f; --mine: #e8f2ec; --warn: #a4571b; --bad: #a02c2c;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --panel: #1e2024; --ink: #e9e9e4; --muted: #9a9a91;
      --line: #2e3138; --accent: #6fbf95; --mine: #24322b; --warn: #d99a4e; --bad: #e07b7b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .14em; text-transform: uppercase; }
  .self { color: var(--muted); font-size: 13px; font-family: var(--mono); }
  main { display: grid; grid-template-columns: 250px 1fr 260px; min-height: calc(100vh - 53px); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } aside { display: none; } }
  aside, .rail { border-right: 1px solid var(--line); padding: 14px; background: var(--panel); }
  .rail:last-child { border-right: 0; border-left: 1px solid var(--line); }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0 0 8px; }
  button {
    font: inherit; padding: 7px 12px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:hover { filter: brightness(1.06); }
  input, textarea {
    font: inherit; width: 100%; padding: 8px 10px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  .stack { display: grid; gap: 8px; }
  .convo-item {
    display: block; width: 100%; text-align: left; margin-bottom: 6px; line-height: 1.3;
  }
  .convo-item small { color: var(--muted); font-family: var(--mono); font-size: 11px; }
  .convo-item[aria-current="true"] { border-color: var(--accent); }
  .chat { display: flex; flex-direction: column; min-height: 0; }
  .chat-head { padding: 12px 18px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .chat-head strong { font-size: 15px; }
  .messages { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 62ch; }
  .msg .who { font-size: 12px; color: var(--muted); }
  .msg .bubble { padding: 8px 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.mine { align-self: flex-end; }
  .msg.mine .bubble { background: var(--mine); }
  .msg.unadmitted .bubble { border-style: dashed; opacity: .65; }
  .composer { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); background: var(--panel); }
  .badge {
    font-size: 11px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line);
    font-family: var(--mono); white-space: nowrap;
  }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .dot.direct { background: var(--accent); }
  .dot.smtp { background: var(--warn); }
  .dot.local { background: #6a8fd8; }
  .dot.offline { background: var(--muted); }
  .peer { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .peer .id { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .peer.blocked { color: var(--bad); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; font-family: var(--mono); }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .log { font-family: var(--mono); font-size: 11px; max-height: 230px; overflow-y: auto; border-top: 1px solid var(--line); padding-top: 8px; }
  .log div { padding: 1px 0; color: var(--muted); }
  .log .warn { color: var(--warn); }
  .log .error { color: var(--bad); }
  .empty { padding: 40px 20px; color: var(--muted); max-width: 46ch; margin: 0 auto; text-align: center; }
  .linkbox { font-family: var(--mono); font-size: 11px; word-break: break-all; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 8px; max-height: 96px; overflow-y: auto; }
  .row { display: flex; gap: 8px; align-items: center; }
  .note { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>LinkChat</h1>
  <span class="self" id="self">connecting…</span>
  <span class="badge" id="conn">local UI: connecting</span>
</header>

<main>
  <aside>
    <h2>Conversations</h2>
    <div id="convos"></div>
    <div class="stack" style="margin-top:14px">
      <button class="primary" id="create">Create Conversation</button>
      <input id="joinLink" placeholder="Paste an invite link">
      <button id="join">Join Conversation</button>
    </div>
  </aside>

  <section class="chat">
    <div class="chat-head" id="head"><strong>No conversation</strong></div>
    <div class="messages" id="messages">
      <div class="empty">
        Create a conversation, then send the invite link to someone.
        Anyone who opens it joins the same conversation.
      </div>
    </div>
    <form class="composer" id="composer">
      <input id="text" placeholder="Type a message…" autocomplete="off" disabled>
      <button class="primary" type="submit" id="send" disabled>Send</button>
    </form>
  </section>

  <div class="rail">
    <h2>Participants</h2>
    <div id="peers" class="note">—</div>

    <h2 style="margin-top:16px">Invite link</h2>
    <div class="stack">
      <div class="linkbox" id="link">—</div>
      <div class="row">
        <button id="copy">Copy</button>
        <button id="newInvite">New link</button>
      </div>
    </div>

    <h2 style="margin-top:16px">Diagnostics</h2>
    <dl class="kv" id="diag"></dl>
    <div class="log" id="log"></div>
  </div>
</main>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const token = params.get("t") || "";
  const $ = (id) => document.getElementById(id);
  let state = null;
  let selected = null;
  let socket = null;

  function connect() {
    socket = new WebSocket(`ws://${location.host}/?t=${encodeURIComponent(token)}`);
    socket.onopen = () => setConn("local UI: connected");
    socket.onclose = () => { setConn("local UI: reconnecting…"); setTimeout(connect, 1000); };
    socket.onmessage = (event) => {
      const payload = JSON.parse(event.data);
      if (payload.type === "state") { state = payload; render(); }
      else if (payload.type === "invite") { showLink(payload.link); }
      else if (payload.type === "error") { alert(payload.message); }
    };
  }
  const setConn = (text) => { $("conn").textContent = text; };
  const send = (message) => socket && socket.readyState === 1 && socket.send(JSON.stringify(message));

  // A link opened in this browser arrives as /join/<id>#<secret fragment>.
  // The fragment never went to any server; hand it to our own node locally.
  if (location.pathname.startsWith("/join/") && location.hash.length > 1) {
    const link = location.origin + location.pathname + location.hash;
    sessionStorage.setItem("linkchat:pendingJoin", link);
    history.replaceState({}, "", "/?t=" + encodeURIComponent(token));
  }

  function render() {
    if (!state) return;
    $("self").textContent = `${state.self.displayName} · ${state.self.peerId}`;
    const views = state.views;
    if (!selected || !views.some((view) => view.conversationId === selected)) {
      selected = views.length ? views[0].conversationId : null;
    }

    $("convos").innerHTML = "";
    for (const view of views) {
      const button = document.createElement("button");
      button.className = "convo-item";
      button.setAttribute("aria-current", String(view.conversationId === selected));
      button.innerHTML = `${escapeHtml(view.title)}<br><small>${view.state.participants.length} participant(s) · ${view.conversationId.slice(0, 12)}…</small>`;
      button.onclick = () => { selected = view.conversationId; render(); };
      $("convos").appendChild(button);
    }

    const view = views.find((entry) => entry.conversationId === selected);
    renderHead(view);
    renderMessages(view);
    renderPeers(view);
    showLink(view ? view.inviteLink : null);
    renderDiagnostics();
    $("text").disabled = !view;
    $("send").disabled = !view;
  }

  function renderHead(view) {
    if (!view) { $("head").innerHTML = "<strong>No conversation</strong>"; return; }
    const admitted = view.state.participants.filter((peer) => peer.admitted).length;
    const label = { direct: "Direct", smtp: "SMTP", local: "Local", offline: "Offline" }[view.connection];
    $("head").innerHTML =
      `<strong>${escapeHtml(view.title)}</strong>` +
      `<span class="note">${admitted} participant${admitted === 1 ? "" : "s"}</span>` +
      `<span class="badge"><span class="dot ${view.connection}"></span>${label}</span>` +
      (view.syncing ? `<span class="badge">Synchronizing…</span>` : "");
  }

  function renderMessages(view) {
    const box = $("messages");
    if (!view) return;
    box.innerHTML = "";
    if (view.state.messages.length === 0) {
      box.innerHTML = '<div class="empty">No messages yet. Share the invite link on the right.</div>';
      return;
    }
    for (const message of view.state.messages) {
      const element = document.createElement("div");
      element.className = "msg" + (message.mine ? " mine" : "") + (message.fromAdmittedPeer ? "" : " unadmitted");
      const when = new Date(message.timestamp).toLocaleTimeString();
      element.innerHTML =
        `<div class="who">${escapeHtml(message.senderName)} · ${when}` +
        (message.fromAdmittedPeer ? "" : " · unverified sender") +
        `</div><div class="bubble">${escapeHtml(message.text)}</div>`;
      box.appendChild(element);
    }
    box.scrollTop = box.scrollHeight;
  }

  function renderPeers(view) {
    const box = $("peers");
    if (!view) { box.textContent = "—"; return; }
    box.innerHTML = "";
    for (const peer of view.state.participants) {
      const route = view.routes.find((entry) => entry.peerId === peer.peerId);
      const state = peer.isSelf ? "you" : route ? route.state : "offline";
      const element = document.createElement("div");
      element.className = "peer" + (peer.admitted ? "" : " blocked");
      element.innerHTML =
        `<span>${escapeHtml(peer.displayName)}${peer.isCreator ? " ·  creator" : ""}` +
        `<br><span class="id">${peer.peerId}</span></span>` +
        `<span class="badge"><span class="dot ${peer.isSelf ? "direct" : state}"></span>${state}</span>`;
      box.appendChild(element);
      if (!peer.admitted) {
        const why = document.createElement("div");
        why.className = "note";
        why.textContent = `not admitted: ${peer.admissionError || "no valid invite"}`;
        box.appendChild(why);
      }
    }
  }

  function showLink(link) {
    $("link").textContent = link || "— (still syncing; you cannot invite until the conversation history arrives)";
    $("link").dataset.link = link || "";
  }

  function renderDiagnostics() {
    const status = state.status;
    const view = state.views.find((entry) => entry.conversationId === selected);
    const rows = {
      "peer id": status.peerId,
      "conversation": view ? view.conversationId : "—",
      "transports": status.transports.map((transport) => `${transport.name}${transport.running ? "" : " (down)"}`).join(", ") || "none",
      "p2p": describe(status.transports.find((transport) => transport.name === "p2p")),
      "smtp": describe(status.transports.find((transport) => transport.name === "smtp")),
      "connections": String(status.connections.length),
      "latency": Object.entries(status.latency).map(([peer, ms]) => `${peer.slice(0, 10)}:${ms == null ? "?" : ms + "ms"}`).join(" ") || "—",
      "frames s/r": `${status.counters.framesSent}/${status.counters.framesReceived}`,
      "records s/r": `${status.counters.recordsSent}/${status.counters.recordsReceived}`,
      "duplicates": String(status.counters.duplicatesSuppressed),
      "rejected": `${status.counters.framesRejected} frames, ${status.counters.recordsRejected} records`,
      "synchronized": `${status.sync.recordsReceived} in, ${status.sync.recordsSent} out`,
      "outbox": String(status.outbox),
    };
    $("diag").innerHTML = Object.entries(rows)
      .map(([key, value]) => `<dt>${escapeHtml(key)}</dt><dd>${escapeHtml(String(value))}</dd>`)
      .join("");
    $("log").innerHTML = state.diagnostics
      .slice(-40).reverse()
      .map((event) => `<div class="${event.level}">${new Date(event.at).toLocaleTimeString()} [${escapeHtml(event.scope)}] ${escapeHtml(event.message)}</div>`)
      .join("");
  }

  const describe = (transport) => (transport ? transport.detail : "not configured");
  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, (character) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[character]);
  }

  $("create").onclick = () => send({ type: "create", title: prompt("Name this conversation", "Conversation") || "Conversation" });
  $("join").onclick = () => {
    const link = $("joinLink").value.trim();
    if (link) { send({ type: "join", link }); $("joinLink").value = ""; }
  };
  $("copy").onclick = async () => {
    const link = $("link").dataset.link;
    if (!link) return;
    try { await navigator.clipboard.writeText(link); $("copy").textContent = "Copied"; }
    catch { $("copy").textContent = "Select it manually"; }
    setTimeout(() => ($("copy").textContent = "Copy"), 1400);
  };
  $("newInvite").onclick = () => selected && send({ type: "invite", conversationId: selected, ttlMinutes: 1440 });
  $("composer").onsubmit = (event) => {
    event.preventDefault();
    const text = $("text").value.trim();
    if (!text || !selected) return;
    send({ type: "send", conversationId: selected, text });
    $("text").value = "";
  };

  connect();
  const pending = sessionStorage.getItem("linkchat:pendingJoin");
  if (pending) {
    sessionStorage.removeItem("linkchat:pendingJoin");
    const timer = setInterval(() => {
      if (socket && socket.readyState === 1) { send({ type: "join", link: pending }); clearInterval(timer); }
    }, 200);
  }
})();
</script>
</body>
</html>
