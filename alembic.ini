[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# The database URL is resolved in migrations/env.py from application settings,
# so that migrations and the running service can never disagree about which
# database they are pointed at. It is intentionally absent here.

# Timestamped, descriptive revision filenames sort chronologically in a
# directory listing, which matters once there are dozens of them.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# Alembic's own logging is configured by the application; these sections exist
# only because Alembic expects them.
[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
