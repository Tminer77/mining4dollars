<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Notes" />
    <meta name="description" content="Field notes kept on this iPad." />
    <title>Notes</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="app" class="app">
      <aside class="rail" aria-label="Navigation">
        <div class="brand">
          <div class="mark" aria-hidden="true">N</div>
          <div>
            <div class="brand-name">Notes</div>
            <div class="brand-sub">This iPad</div>
          </div>
        </div>
        <nav class="nav">
          <a class="nav-item" href="index.html">Apps</a>
          <a class="nav-item is-active" href="notes.html">Notes</a>
          <a class="nav-item" href="console.html">Console</a>
        </nav>
        <div class="rail-foot">
          <div id="keep-pill" class="pill" data-state="ok">Kept on this iPad</div>
        </div>
      </aside>

      <section class="pane list-pane">
        <header class="pane-head">
          <div>
            <h1>Notes</h1>
            <p class="lede">Written here, stored here.</p>
          </div>
          <button type="button" class="btn primary" id="note-new">New</button>
        </header>
        <div class="filters">
          <label class="field search-field">
            <span>Search this iPad</span>
            <input id="note-search" type="search" placeholder="title or body" />
          </label>
        </div>
        <div id="note-list" class="event-list" role="list"></div>
      </section>

      <section class="pane detail-pane">
        <div class="empty" id="note-empty">
          <h2>No note selected</h2>
          <p>New notes stay on this iPad even with no network.</p>
        </div>
        <article id="note-editor" class="note-editor" hidden>
          <input id="note-title" maxlength="200" placeholder="Title" />
          <textarea id="note-body" placeholder="Write on this iPad"></textarea>
          <div class="actions">
            <button type="button" class="btn" id="note-share">Share</button>
            <button type="button" class="btn" id="note-delete">Delete</button>
          </div>
        </article>
      </section>
    </div>

    <div id="toast" class="toast" hidden></div>
    <script src="store.js" defer></script>
    <script src="notes.js" defer></script>
  </body>
</html>
